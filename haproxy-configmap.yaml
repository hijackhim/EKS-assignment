apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
data:
  haproxy.cfg: |
    global
      daemon

    defaults
      mode http
      timeout connect 5s
      timeout client 50s
      timeout server 50s

    frontend http_front
      bind *:8080
      default_backend tomcat_backend

    backend tomcat_backend
      balance roundrobin
      server tomcat1 tomcat-service:8080 check